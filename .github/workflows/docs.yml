name: Documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install documentation dependencies
        run: uv pip install --system -e ".[docs]"

      - name: Cache Zenodo Example Datasets
        id: cache-zenodo
        uses: actions/cache@v4
        with:
          path: docs/source/_examples/example_data
          key: zenodo-example-data-15800729
          save-always: true

      - name: Download Zenodo Example Datasets
        if: steps.cache-zenodo.outputs.cache-hit != 'true'
        run: |
          python - <<'EOF'
          from zenodozipdownloader import ZenodoZipDownloader

          dl = ZenodoZipDownloader(
              doi="10.5281/zenodo.15800729",
              download_dir="docs/source/_examples/example_data",
          )
          dl.download(inner_pattern="005_mfp1_500x.mp")
          dl.download("Figure 2.zip/006_dynamin_6.mp")
          dl.download("Figure 4.zip/4a/PBS_4.mp")
          EOF

      - name: Build Sphinx HTML Documentation
        run: |
          cd docs
          make html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build/html

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
